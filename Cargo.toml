[package]
name = "bevy_unified_input"
version = "0.2.1"
authors = ["Oleks Pickle <22867443+olekspickle@users.noreply.github.com>"]
description = "A unified input primitives"
keywords = ["bevy", "inoput"]
categories = ["game-development"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/olekspickle/bevy_unified_input"
homepage = "https://github.com/olekspickle/bevy_unified_input"
readme = "README.md"
edition = "2024"

[dependencies]
bevy_input = { path = "../bevy/crates/bevy_input", features = ["gamepad", "mouse", "keyboard"] }
bevy_ecs = { path = "../bevy/crates/bevy_ecs" , default-features = false }

[dev-dependencies.bevy]
# path = "../bevy/"
version = "0.18.0"
default-features = false
features = [ "3d_bevy_render", "ui_bevy_render", "wayland", "debug", "default_font"  ]

[dev-dependencies]
bevy_top_down_camera = "0.3"

[features]
default = []